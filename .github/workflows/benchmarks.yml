---
name: Benchmark

# Only run the benchmarks on PRs with the "CI: benchmark" label, since they take a while.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

permissions: {}

env:
  PR_HEAD_LABEL: ${{ github.event.pull_request.head.label }}

jobs:
  benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'CI: benchmark')
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASV_DIR: ./benchmarks

    steps:
      # asv needs the full history to check out the base commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine the baseline
        id: baseline
        # Compare against the first parent of the test merge commit, i.e. the base
        # branch this PR was merged into. `pull_request.base.sha` can lag behind it,
        # which attributes changes on the base branch to the PR.
        run: echo "sha=$(git rev-parse "${GITHUB_SHA}^1")" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install asv
        run: python -m pip install asv py-rattler

      - name: Run benchmarks
        id: benchmark
        env:
          ASV_FACTOR: 1.5
          BASE_LABEL: ${{ github.event.pull_request.base.label }}
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -x
          # ID this runner
          asv machine --yes
          echo "Baseline:  ${BASE_SHA} (${BASE_LABEL})"
          echo "Contender: ${GITHUB_SHA} (${PR_HEAD_LABEL})"
          # Run the benchmarks for the current commit against the base. The
          # environments are created with rattler, which doesn't need conda.
          asv continuous --environment rattler --split --show-stderr --factor "$ASV_FACTOR" \
              "$BASE_SHA" "$GITHUB_SHA" \
              | sed "/Traceback \|failed$\|PERFORMANCE DECREASED/ s/^/::error::/" \
              | tee benchmarks.log
          if grep "Traceback \|failed\|PERFORMANCE DECREASED" benchmarks.log > /dev/null ; then
              exit 1
          fi
        working-directory: ${{ env.ASV_DIR }}

      - name: Write the PR comment
        # read by `benchmarks-comment.yml`, which posts it on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          ASV_FACTOR: 1.5
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # pick one of the given messages at random
          pick() { local messages=("$@"); echo "${messages[RANDOM % ${#messages[@]}]}"; }

          compare=$(asv compare --split --only-changed --factor "$ASV_FACTOR" "$BASE_SHA" "$GITHUB_SHA" 2>&1)
          status=$?
          # the first column of the table marks benchmarks that got better (-), worse (+),
          # started failing (!), were fixed (*) or are not comparable (x)
          changes=$(grep -E '^\| [-+!*x] ' <<< "$compare" | cut -c3)
          if [ $status -ne 0 ]; then
            title=$(pick \
              "💥 The benchmarks could not be compared. Here be dragons." \
              "💥 Something went wrong while comparing the benchmarks. The results fell off the edge of the map.")
          elif grep -q '[+!]' <<< "$changes" && grep -q '[-*]' <<< "$changes"; then
            title=$(pick \
              "🏔️ Some benchmarks got better, some got worse. Hilly terrain ahead!" \
              "📐 Some benchmarks got better, some got worse. Everything is distorted, must be Mercator.")
          elif grep -q '[+!]' <<< "$changes"; then
            title=$(pick \
              "🐌 Some benchmarks got worse. Even continental drift is faster." \
              "🐢 This PR takes the scenic route: some benchmarks got worse. Someone forgot the great circle." \
              "🧭 The benchmarks went the wrong way. Time to check the compass.")
          elif grep -q '[-*]' <<< "$changes"; then
            title=$(pick \
              "🚀 Some benchmarks got better. Around the world in less than 80 days!" \
              "✈️ Some benchmarks improved. Taking the great circle route!" \
              "🗺️ Some benchmarks got better. Shortcut found on the map!")
          else
            title=$(pick \
              "😴 No significant changes. Flat as the Netherlands." \
              "🌍 No significant changes. The Earth keeps turning at the same speed." \
              "📍 No significant changes. You are here, same as before.")
          fi

          mkdir -p comment
          echo "$PR_NUMBER" > comment/pr_number
          {
            echo "<!-- asv-benchmark-comment -->"
            echo "## $title"
            echo
            if [ $status -eq 0 ] && [ -n "$changes" ]; then
              # replace asv's markers by something more fun, and separate the tables
              # of the different groups by a blank line: with --only-changed, asv
              # prints them right after each other, which markdown renders as one table
              sed -E \
                -e 's/^\| - +\|/| 🚀 |/' \
                -e 's/^\| \+ +\|/| 🐌 |/' \
                -e 's/^\| ! +\|/| 💥 |/' \
                -e 's/^\| \* +\|/| 🩹 |/' \
                -e 's/^\| x +\|/| 🤷 |/' \
                <<< "$compare" \
                | awk '/^\| Change / && NR > 1 { print "" } { print }'
              echo
              echo "🚀 better · 🐌 worse · 💥 now failing · 🩹 fixed · 🤷 not comparable"
              echo
            fi
            echo "Comparing \`${GITHUB_SHA::8}\` (this PR merged into the base branch)" \
              "with \`${BASE_SHA::8}\` (base branch)."
            echo "Only changes by more than a factor of $ASV_FACTOR are shown," \
              "see [the workflow run]($RUN_URL) for all results."
          } > comment/comment.md
          cat comment/comment.md
        working-directory: ${{ env.ASV_DIR }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: asv-benchmark-comment
          path: ${{ env.ASV_DIR }}/comment

      - name: Add the log to the results
        if: always()
        run: cp benchmarks.log results/
        working-directory: ${{ env.ASV_DIR }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: asv-benchmark-results
          path: ${{ env.ASV_DIR }}/results
