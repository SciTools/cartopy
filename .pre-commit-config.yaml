---
ci:
  autofix_prs: false
  autoupdate_schedule: 'quarterly'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Prevent giant files from being committed
      - id: check-added-large-files
      # Check whether files parse as valid Python
      - id: check-ast
      # Check for files that contain merge conflict strings
      - id: check-merge-conflict
      # Attempts to load all TOML files to verify syntax
      - id: check-toml
      # Attempts to load all yaml files to verify syntax
      - id: check-yaml
      # Check for debugger imports and py37+ breakpoint() calls in python source
      - id: debug-statements
      # Makes sure files end in a newline and only a newline
      - id: end-of-file-fixer
      # Replaces or checks mixed line ending
      - id: mixed-line-ending
      # Protect specific branches from direct checkins (main)
      - id: no-commit-to-branch
      # Trims trailing whitespace
      - id: trailing-whitespace
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        types_or: [python, markdown, rst]
  - repo: https://github.com/aio-libs/sort-all
    rev: 424f64d274d148f6af75fb1e9f5db81cc3cdbd7a  # frozen: v1.3.0
    hooks:
      - id: sort-all
        types: [file, python]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict", "--config-file=.yamllint.yml"]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
